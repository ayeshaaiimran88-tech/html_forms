<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Comprehensive Html Form Creation</h1>
    <h2>User Registration Form</h2>
     <form>
       <p>First Name:<input/></p>
        <p>Last Number:<input /></p>
        <p>Password::<input type="password"/></p>
        <p>Bio:<textarea name="bio" cols="20" rows="4"></textarea></p>
        <p>Gender:</br>
            <input type="radio" name="gender" value="Male"/>male</br>
            <input type="radio" name="gender" value="Female"/>Female</br>
            <input type="radio" name="gender" value="Other"/>Other</br>
        </p>
        <p>Interests:</br>
            <input name="interests" type="checkbox" value="Music" checked="checked"/>Music
            <input name="interests" type="checkbox" value="Sports" checked="checked"/>Sports
            <input name="interests" type="checkbox" value="Reading" checked="checked"/>Reading
        </p>
        <p>Country:
        <select name="country name">
            <option value="Pakistan">Pakistan</option>
            <option vvalue="United States">United states</option>
            <option value="India">India</option>
            <option value="Europe">Europe</option>
            <option value="Russia">Russia</option>
            </select>
        </br>
        </p>
        <p>Preferred Colors:</br>
            <select name="colors" size="4">
            <option value="Red">Red</option>
            <option value="Green">Green</option>
            <option value="Black">Black</option>
            <option value="White">White</option>
            </select>
        </p>
        <p>Profile Picture:</br>
        <input type="file" placeholder="chose file"/></p>
        <p>Birthdate:</br>
        <input type="date"/></p>
        <p>Email:</br>
        <input type="email"/></p>
        <p>Website:</br>
        <input type="url"/></p>
        <p>search:</br>
        <input type="search" placeholder="search here" name="query"/></p>
        <button type="submit">submit</button>
     </form>
</body>
</html>
